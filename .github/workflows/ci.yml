name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and the current one. A break on 3.10 that
        # 3.13 hides is exactly the kind of thing this matrix is here to find.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with coverage gate
        # --cov-fail-under=100 is deliberate. The suite has been at 100% since
        # week 5; letting it slip silently is how the gate stops meaning
        # anything. If a line genuinely cannot be covered, argue it in review
        # rather than lowering this number.
        run: |
          pytest --cov=consentml --cov-report=term-missing --cov-fail-under=100

      - name: Check the CLI is installed and runnable
        run: |
          consentml --help
          consentml verify --help
          consentml migrate --help
