name: Publish to PyPI

# Publishes on every version tag. The tag must match the version in
# pyproject.toml, or the build step fails before anything is uploaded.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no API token is stored in GitHub. PyPI is
    # configured to trust this repo + workflow + environment. See setup notes
    # in the PR/commit that added this file.
    environment:
      name: pypi
      url: https://pypi.org/project/consentml/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Guard — tag must match pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
