name: Publish to PyPI

# Publishes on every version tag. The tag must match the version in
# pyproject.toml, or the build step fails before anything is uploaded.
# TestPyPI runs first as a rehearsal; real PyPI only runs if it succeeds.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Guard — tag must match pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no API token stored in GitHub. TestPyPI must
    # be configured to trust this repo + workflow + the "testpypi" environment.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/consentml/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run of the same version must not fail the pipeline.
          skip-existing: true

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    # PyPI must be configured to trust this repo + workflow + "pypi" environment.
    environment:
      name: pypi
      url: https://pypi.org/project/consentml/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
