[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consentml"
version = "0.1.0.dev0"
description = "Data-lineage tracking and consent-revocation reporting for ML pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
pdf = ["reportlab>=4.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "scikit-learn",
    # Used by tests/test_notebook.py to execute the demo notebook.
    "nbclient",
    "nbformat",
    "ipykernel",
    "psycopg[binary]>=3.1",
    # Exercises the --format pdf path; the extra itself is optional at runtime.
    "reportlab>=4.0",
]

[project.scripts]
consentml = "consentml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/consentml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
