[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consentml"
version = "0.2.0"
description = "Data-lineage tracking and consent-revocation reporting for ML pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lokesh Karanam", email = "sunnylokesh3@gmail.com" }]
keywords = ["data-lineage", "consent", "gdpr", "machine-learning", "provenance", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pandas>=2.0"]

[project.urls]
Homepage = "https://consentml.lokeshkaranam.me/"
Documentation = "https://consentml.lokeshkaranam.me/"
Repository = "https://github.com/KaranamLokesh/consentml"
Issues = "https://github.com/KaranamLokesh/consentml/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
snowflake = ["snowflake-connector-python>=3.7"]
pdf = ["reportlab>=4.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "scikit-learn",
    # Used by tests/test_notebook.py to execute the demo notebook.
    "nbclient",
    "nbformat",
    "ipykernel",
    "psycopg[binary]>=3.1",
    "snowflake-connector-python>=3.7",
    # Exercises the --format pdf path; the extra itself is optional at runtime.
    "reportlab>=4.0",
]

[project.scripts]
consentml = "consentml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/consentml"]

[tool.hatch.build.targets.sdist]
include = [
    "src/consentml",
    "tests",
    "examples",
    "docs",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
